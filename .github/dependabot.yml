# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"

  # Site build/test tooling (dev-only: Playwright, serve, Lighthouse CI).
  # Minor + patch bundled into one weekly PR; majors and security fixes still
  # come as their own PRs.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    groups:
      npm-site:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Guestbook / counter Azure Functions API (@azure/functions, @azure/data-tables).
  - package-ecosystem: "npm"
    directory: "/api"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    groups:
      npm-api:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

        .four-oh-four {
            --gradient: linear-gradient(-45deg, #0f4c81, #c84534, #6a4c93, #8a6f00, #5a7b3b);
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .glitch-code {
            font-family: 'Doto', monospace;
            font-size: clamp(6rem, 20vw, 12rem);
            font-weight: 700;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 0.5rem;
            animation: glitch-shake 3s infinite;
            position: relative;
            display: inline-block;
            max-width: 100%;
            overflow: hidden;
        }
        .glitch-code::after {
            content: '404';
            position: absolute;
            left: 0;
            top: 2px;
            background: var(--gradient);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0.3;
            animation: glitch-shift 3s infinite;
        }
        @keyframes glitch-shake {
            0%, 93%, 100% { transform: translate(0); }
            94% { transform: translate(-2px, 1px); }
            95% { transform: translate(2px, -1px); }
            96% { transform: translate(-1px, 2px); }
        }
        @keyframes glitch-shift {
            0%, 93%, 100% { clip-path: inset(0 0 0 0); }
            94% { clip-path: inset(20% 0 60% 0); transform: translate(4px, 0); }
            95% { clip-path: inset(50% 0 20% 0); transform: translate(-4px, 0); }
            96% { clip-path: inset(70% 0 5% 0); transform: translate(3px, 0); }
        }
        .lost-message {

            font-size: 1.25rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            max-width: 500px;

        .lost-message strong {

        }
        .ascii-lost {

            font-size: 0.7rem;
            line-height: 1.15;
            color: var(--accent);
            white-space: pre;
            margin-bottom: 2rem;
            opacity: 0.8;
        }
        .home-btn {

            text-decoration: none;
            cursor: pointer;
            appearance: none;
            margin: 0.35rem;
            transition: transform 0.2s, box-shadow 0.2s;

        .home-btn:hover {

        /* GeoCities overrides */
